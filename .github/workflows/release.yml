name: Release

# Push a tag like v1.0.0 to build FnLockBar.app and attach it to a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh --no-install

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/FnLockBar.zip \
            --title "FnLockBar $GITHUB_REF_NAME" --generate-notes

      - name: Upload build artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: FnLockBar
          path: build/FnLockBar.zip
